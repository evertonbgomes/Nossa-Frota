<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editar Requisições de Viagens</title>
    <script type="text/javascript">
        function goBack() {
            window.history.back();
        }
    </script>
    <!-- Adicionar Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Editar Requisições de Viagens</h1>
        <form th:action="@{/index/trip-edit/{id}(id=${tripRequest.id})}" th:object="${tripRequest}" method="post">
            <div class="form-group">
                <label for="driver">Motorista:</label>
                <select id="driver" class="form-control" th:field="*{driver.id}" required>
                    <option value="" selected>Selecione Motorista</option>
                    <option th:each="driver : ${drivers}" th:value="${driver.id}" th:text="${driver.name}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="vehicle">Veículo:</label>
                <select id="vehicle" class="form-control" th:field="*{vehicle.id}" required>
                    <option value="" selected>Selecionar Veículo</option>
                    <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.model} + ' - ' + ${vehicle.licensePlate}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="tripStartTime">Inicio da Viagem:</label>
                <input type="datetime-local" id="tripStartTime" class="form-control" th:field="*{tripStartTime}" required>
            </div>
            <div class="form-group">
                <label for="tripEndTime">Fim da Viagem:</label>
                <input type="datetime-local" id="tripEndTime" class="form-control" th:field="*{tripEndTime}" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
        <button class="btn btn-secondary mt-3" onclick="goBack()">Voltar</button>
    </div>

    <!-- Adicionar Bootstrap JS e dependências -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
