<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ver Trip Requests</title>
    <script type="text/javascript">
        function goBack() {
            window.history.back();
        }
    </script>
    <!-- Adicionar Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mt-5">Viagens</h1>
    <a th:href="@{/trip-requests/add}" class="btn btn-primary mb-3">Nova Viagem</a>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Motorista</th>
                <th>Veículo</th>
                <th>Início</th>
                <th>Fim</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tripRequest : ${tripRequests}">
                <td th:text="${tripRequest.id}"></td>
                <td th:text="${tripRequest.driver.name}"></td>
                <td th:text="${tripRequest.vehicle.model} + ' - ' + ${tripRequest.vehicle.licensePlate}"></td>
                <td th:text="${#temporals.format(tripRequest.tripStartTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${#temporals.format(tripRequest.tripEndTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${tripRequest.status}"></td>
                <td>
                    <a th:href="@{/trip-requests/edit/{id}(id=${tripRequest.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/trip-requests/user-delete/{id}(id=${tripRequest.id})}" class="btn btn-danger btn-sm">Deletar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <button class="btn btn-secondary mt-3" onclick="goBack()">Voltar</button>
</div>

<!-- Adicionar Bootstrap JS e dependências -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
