<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adicionar Usuário</title>
    <script type="text/javascript">
        function goBack() {
            window.history.back();
        }
    </script>
    <!-- Adicionar Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Adicionar Usuário</h1>
        <form th:action="@{/users/add}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="name">Nome:</label>
                <input type="text" id="name" class="form-control" th:field="*{name}" required>
            </div>
            <div class="form-group">
                <label for="role">Tipo:</label>
                <select id="role" class="form-control" th:field="*{role}" required>
                    <option value="" selected>Selecione um Tipo</option>
                    <option value="ADMIN">ADMIN</option>
                    <option value="MOTORISTA">MOTORISTA</option>
                </select>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" required>
            </div>
            <div class="form-group">
                <label for="document">CPF:</label>
                <input type="text" id="document" class="form-control" th:field="*{document}" required>
            </div>
            <div class="form-group">
                <label for="phone">Telefone:</label>
                <input type="text" id="phone" class="form-control" th:field="*{phone}" required>
            </div>
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" class="form-control" th:field="*{username}" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" class="form-control" th:field="*{password}" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
        <button class="btn btn-secondary mt-3" onclick="goBack()">Voltar</button>
    </div>

    <!-- Adicionar Bootstrap JS e dependências -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
